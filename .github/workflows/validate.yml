name: Validate project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Godot milestone suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GODOT_VERSION: 4.6.3
      GODOT_ARCHIVE: Godot_v4.6.3-stable_linux.x86_64.zip
      GODOT_SHA256: d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Godot release
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/$GODOT_ARCHIVE"
          install_dir="$RUNNER_TEMP/godot"

          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive_path" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/$GODOT_ARCHIVE"
          echo "$GODOT_SHA256  $archive_path" | sha256sum --check -

          mkdir -p "$install_dir"
          unzip -q "$archive_path" -d "$install_dir"
          chmod +x "$install_dir/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Run project verification
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            bash ./scripts/verify_project.sh
